name: FastAPI CI/CD

on:
  push:
    branches:
      - main 
      - dev  # trigger only when pushing to main and  dev branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          IMAGE=mgmeti/fast-api-service
          TAG=${GITHUB_SHA::7}
          docker build -t $IMAGE:$TAG -t $IMAGE:latest ./fast-api-service-deployement
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'

      - name: Configure Kubeconfig
        run: |
          echo "${KUBE_CONFIG_DATA}" | base64 --decode > kubeconfig.yaml
          export KUBECONFIG=$PWD/kubeconfig.yaml

      - name: Deploy with Helm
        run: |
          helm upgrade --install fastapi ./fast-api-service-deployement/fastapi-chart \
            --set image.repository=mgmeti/fast-api-service \
            --set image.tag=${GITHUB_SHA::7}
