services:
  api:
   build: .
   container_name: fastapi_app
   ports:
     - "8000:8000"
   depends_on:
     - db
   environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/dbtest
      - DB_HOST=db
      - DB_NAME=dbtest
      - DB_USER=postgres
      - DB_PASSWORD=postgres

  db:
    image: postgres:15
    container_name: postgres_db
    environment:
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=postgres
    - POSTGRES_DB=dbtest
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data



volumes:
  postgres_data:
