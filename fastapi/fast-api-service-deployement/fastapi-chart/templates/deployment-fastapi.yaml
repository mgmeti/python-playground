apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  labels:
    app: fastapi
spec:
  replicas: {{ .Values.fastapi.replicas }}
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
        - name: fastapi
          image: "{{ .Values.fastapi.image }}:{{ .Values.fastapi.tag }}"
          ports:
            - containerPort: {{ .Values.fastapi.port }}
          env:
            - name: DB_HOST
              value: "{{ .Values.fastapi.env.DB_HOST }}"
            - name: DB_NAME
              value: "{{ .Values.fastapi.env.DB_NAME }}"
            - name: DB_USER
              value: "{{ .Values.fastapi.env.DB_USER }}"
            - name: DB_PASSWORD
              value: "{{ .Values.fastapi.env.DB_PASSWORD }}"
