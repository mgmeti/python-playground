services:
  db:
   image: postgres:15
   container_name: users_postgres
   environment:
     POSTGRES_USER: postgres
     POSTGRES_PASSWORD: postgres
     POSTGRES_DB: users_db
  #  ports:
  #    - "5432:5432"
   volumes:
     - posgres_data:/var/lib/postgresql/data
  
  web:
    build: .
    container_name: fastapi_app
    command: ./entrypoint.sh
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: users_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@db:5432/users_db
      

volumes:
  posgres_data:

